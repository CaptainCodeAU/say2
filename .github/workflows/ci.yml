name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # macos-15's default Xcode (16.4) ships Swift 6.1, but Package.swift
    # requires swift-tools-version 6.2 (Xcode 26+, per README requirements).
    # macos-26 defaults to Xcode 26.6, which matches.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
